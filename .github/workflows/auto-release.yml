name: Auto Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          scope: '@team-jd'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Decide version bump
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%B)"
          bump="patch"
          if echo "$msg" | grep -Eq 'BREAKING CHANGE|!:'; then
            bump="major"
          elif echo "$msg" | grep -Eq '^(feat)(\(.+\))?:'; then
            bump="minor"
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: Bump version + tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          bump="${{ steps.bump.outputs.bump }}"
          npm version "$bump" -m "chore(release): %s [skip ci]"
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Require publish credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Both NPM_TOKEN and NODE_AUTH_TOKEN are empty. Add the secret under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi

      - name: Configure npm authentication
        shell: bash
        run: |
          set -euo pipefail
          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          npm config set @team-jd:registry "https://registry.npmjs.org/"
          echo "Authenticated as: $(npm whoami)"

      - name: Publish to npm
        shell: bash
        run: |
          set -euo pipefail
          npm publish --access public

      - name: Push tag + version commit
        shell: bash
        run: |
          set -euo pipefail
          git push
          git push --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ### 📦 Installation

            ```json
            {
              "mcpServers": {
                "project-explorer": {
                  "command": "npx",
                  "args": ["-y", "@team-jd/mcp-project-explorer", "/your/project/path"]
                }
              }
            }
            ```
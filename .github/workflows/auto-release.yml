name: Auto Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Decide version bump
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%B)"
          bump="patch"
          if echo "$msg" | grep -Eq 'BREAKING CHANGE|!:'; then
            bump="major"
          elif echo "$msg" | grep -Eq '^(feat)(\(.+\))?:'; then
            bump="minor"
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: Bump version + tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          bump="${{ steps.bump.outputs.bump }}"
          npm version "$bump" -m "chore(release): %s [skip ci]"
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      # Publish before the tag is pushed: a tag with no matching npm release is
      # exactly how 0.1.2 ended up versioned but unobtainable.
      - name: Require NPM_TOKEN
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Secret NPM_TOKEN is not configured. Add a Granular Access Token (Read and publish of @team-jd/mcp-project-explorer) to repo secrets." >&2
            exit 1
          fi

      # Names the identity behind the token, so a rejected publish is diagnosable
      # from the log instead of guesswork. Non-fatal: still reach the publish step.
      - name: Verify npm identity
        shell: bash
        continue-on-error: true
        run: |
          echo "registry: $(npm config get registry)"
          echo "npm user for NPM_TOKEN: $(npm whoami)"

      - name: Publish to npm
        shell: bash
        run: |
          set -euo pipefail
          if ! npm publish --access public; then
            echo "npm publish was rejected. A 404 on PUT for a scoped name means the token is not authorized to publish this package; npm hides permission failures as 404." >&2
            echo "Recreate NPM_TOKEN on the account that owns @team-jd (npm user 'team-jd') as either:" >&2
            echo "  - an Automation token, or" >&2
            echo "  - a Granular Access Token listing @team-jd/mcp-project-explorer with 'Read and publish' AND 'bypass 2FA'." >&2
            echo "Then re-run this workflow; no new push is needed." >&2
            echo "::error::npm publish rejected for @team-jd/mcp-project-explorer - see message above in this step's log." >&2
            exit 1
          fi

      - name: Push tag + version commit
        shell: bash
        run: |
          set -euo pipefail
          git push
          git push --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
